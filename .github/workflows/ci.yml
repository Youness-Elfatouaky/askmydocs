# =============================================================================
# AskMyDocs — Continuous Integration
#
# Runs on every push to main and every pull request targeting main.
# Two jobs run in parallel on fresh Ubuntu runners:
#   - backend:  install Python deps, lint with ruff, smoke-import the app
#   - frontend: install Node deps, typecheck with tsc, build with vite
#
# A red check here blocks merging (once branch protection is enabled).
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint + import smoke test
  # ---------------------------------------------------------------------------
  backend:
    name: Backend · lint + smoke import
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/Requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check .

      # Quickest "did I break the app?" check: import main.
      # We pass dummy env so pydantic-settings doesn't complain.
      - name: Smoke import
        env:
          DATABASE_URL: "postgresql+asyncpg://ci:ci@localhost/ci"
          JWT_SECRET_KEY: "ci-not-a-real-secret"
          OPENAI_API_KEY: "ci-not-a-real-key"
        run: python -c "import main; print('FastAPI app imports OK')"

  # ---------------------------------------------------------------------------
  # Frontend: typecheck + build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` is the CI-friendly cousin of `npm install`:
      # - requires package-lock.json (deterministic)
      # - faster
      # - errors instead of silently fixing drift
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
