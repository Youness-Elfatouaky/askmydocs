# Nginx config for the production frontend image.
# - Serves the static React bundle from /usr/share/nginx/html.
# - SPA fallback: any unknown path returns index.html so client-side routing works.
# - In a real deployment, /api/v1/* would be proxied to the backend or routed
#   through an ALB / CloudFront. For local prod-mode testing, the React app calls
#   the backend directly via VITE_API_URL=http://localhost:8000.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
