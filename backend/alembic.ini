# Alembic config for AskMyDocs.
# The DATABASE_URL is injected programmatically in alembic/env.py from
# our pydantic Settings, so we don't need sqlalchemy.url here.

[alembic]
script_location = alembic
prepend_sys_path = .
# Filenames look like: 2026_05_10_0001_initial_schema.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s
# Don't truncate slugs in filenames
truncate_slug_length = 50
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
