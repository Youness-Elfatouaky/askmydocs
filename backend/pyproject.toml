# Backend tooling config (ruff for now; pytest etc. later).
# Kept here so local runs and CI behave identically.

[tool.ruff]
line-length = 100
target-version = "py312"
# alembic/versions/ holds autogenerated migration files — they're "data",
# not hand-written code. Don't bother linting them; they need to RUN, not
# be pretty. Hand-written alembic/env.py + script.py.mako are still linted.
extend-exclude = ["venv", "__pycache__", ".venv", "alembic/versions"]

[tool.ruff.lint]
# A pragmatic starter set. Tighten later as the codebase matures.
#   E, W = pycodestyle errors / warnings
#   F    = pyflakes (undefined names, unused imports)
#   I    = isort (import ordering)
#   UP   = pyupgrade (modern syntax)
#   B    = flake8-bugbear (likely bugs)
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
  "E501",  # line length handled by formatter, not enforced
  "B008",  # FastAPI pattern: Depends(get_db) in arg defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py are intentional re-exports

[tool.ruff.lint.isort]
# Make first-party detection deterministic.
known-first-party = ["core", "models", "schemas", "routers", "services", "utils"]
# Override ruff's auto-detection: backend/alembic/ exists as a folder, so
# ruff would otherwise classify the third-party `alembic` package as our code.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
